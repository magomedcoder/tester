[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "LLM agent for generating and fixing tests: unit, integration, UI, and contract"

[workspace.dependencies]
tester-core = { path = "crates/tester-core" }
tester-lang = { path = "crates/tester-lang" }
tester-providers = { path = "crates/tester-providers" }
tester-analysis = { path = "crates/tester-analysis" }
tester-security = { path = "crates/tester-security" }
tester-pipeline = { path = "crates/tester-pipeline" }
tester-agent = { path = "crates/tester-agent" }
tester-tui = { path = "crates/tester-tui" }
tester-wiki = { path = "crates/tester-wiki" }

anyhow = "1"
url = "2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
walkdir = "2"
tempfile = "3"
